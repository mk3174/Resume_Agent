# Copy to settings.yaml and edit. settings.yaml is gitignored.

# ----------------------------------------------------------------------
# LLM router: which models handle which tasks.
# ----------------------------------------------------------------------
llm:
  # Which provider to try first for each task. Falls back to next on error.
  # Local-only: every task runs on the Ollama Gemma model. No external escalation.
  routes:
    tailor_jd:   [ollama]            # JD keyword extract — local
    tailor_star: [anthropic]          # STAR experience + project bullets — cloud only
    tailor:      [ollama]            # single_call mode fallback
    responder:   [ollama]            # custom application Q&A
    rerank:      [ollama]            # project selection — local
    tailor_ats:  [ollama]            # ATS keyword boost when coverage < threshold

  providers:
    ollama:
      host: ${OLLAMA_HOST:-http://localhost:11434}
      models:
        chat:    gemma4:e4b         # default chat model (Ollama tag)
        rerank:  gemma4:e4b
        embed:   nomic-embed-text    # 768-dim, local, free
      timeout_s: 600
      # Size depends on Ollama's quantisation for this tag; adjust timeout_s if cold loads are slow.
    anthropic:
      model: claude-sonnet-4-5-20250929
      max_tokens: 4096
      temperature: 0.2
    openai:
      model: gpt-4o
      max_tokens: 4096
      temperature: 0.2

  # Hard monthly budget cap for paid providers (USD). Hits this -> auto-fallback to local.
  budget_usd_per_month: 10.00

# ----------------------------------------------------------------------
# Tailor strategy.
# ----------------------------------------------------------------------
tailor:
  mode: chained_local        # chained_local | single_call
  ats_keyword_threshold: 0.90   # tune resume until must-have keyword coverage >= 90%
  max_retailor_attempts: 3
  ats_tune_max_attempts: 3      # deterministic skills + local Ollama rewrites
  resume_max_words: 900
  min_experience_bullets: 3     # per role (pad from master base bullets when LLM returns fewer)
  max_experience_bullets: 5
  min_project_bullets: 2        # per selected personal project
  max_project_bullets: 3
  embellishment_policy: library_plus_metrics  # library_only | library_plus_metrics | full_synthesis (NOT recommended)
  estimate_tag: "[ESTIMATE]"
  top_k_projects: 10          # pre-filter by embedding before LLM rerank/select
  # STAR step emits large JSON; 2400 tokens often truncates mid-string → JSONDecodeError.
  star_bullets_max_tokens: 8000
  single_call_max_tokens: 8000

# ----------------------------------------------------------------------
# Responder strategy (custom Q&A).
# ----------------------------------------------------------------------
responder:
  qa_memory_path: data/qa_memory.json
  similarity_threshold: 0.85   # if cached Q matches this closely, auto-answer
  confidence_threshold: 0.70   # below this -> Telegram barrier
  always_escalate_keywords:
    - sponsor
    - visa
    - h1b
    - salary
    - compensation
    - race
    - gender
    - veteran
    - disability
    - felony

# ----------------------------------------------------------------------
# Ingestion: which ATS company boards to poll.
#   Greenhouse: token = path segment of boards.greenhouse.io/<token>
#   Lever:      token = path segment of jobs.lever.co/<token>
#   Ashby:      token = path segment of jobs.ashbyhq.com/<token>
# Add/remove freely. Tokens are usually the company's slug.
# ----------------------------------------------------------------------
ingest:
  greenhouse_boards:
    - airbnb
    - stripe
    - anthropic
    - figma
  lever_boards:
    - netflix
    - palantir
  ashby_boards:
    - openai
    - linear

  # Phase 4 platforms (off by default — require Patchright + a one-time login).
  # LinkedIn does not publish automation limits. Defaults err on the side of a
  # slow human: few listings per sweep, long random gaps, slow scroll. Raise
  # throughput only if you accept restriction risk.
  linkedin:
    enabled: false
    storage_state_path: storage_state/linkedin.json
    # Each entry is a comma-separated keywords string passed to one search URL.
    # Fewer rows = fewer searches per `ingest` (each row opens a browser sweep).
    search_keywords:
      - "AI engineer, LLM engineer"
    location: "United States"
    max_listings_per_run: 8
    min_seconds_between_requests: 15
    max_seconds_between_requests: 35
    post_search_page_delay_min: 5
    post_search_page_delay_max: 14
    scroll_step_delay_min: 2.2
    scroll_step_delay_max: 5.0
    # Easy Apply wizard (apply/linkedin.py): pause between steps like a careful user.
    easy_apply_step_delay_min: 6
    easy_apply_step_delay_max: 16
    # Real submits only: minimum wall time between LinkedIn "Submit application" clicks.
    min_seconds_between_easy_apply_submits: 900
    # At most this many LinkedIn keyword searches per `resume-agent ingest` (each is a browser session).
    max_searches_per_ingest: 1
  indeed:
    enabled: false
    storage_state_path: storage_state/indeed.json
    proxy_url: ${PROXY_URL}
    search_keywords:
      - "AI engineer"
      - "LLM engineer"
      - "Machine Learning engineer"
    location: "Remote"
    max_listings_per_run: 20
    min_seconds_between_requests: 3
    max_seconds_between_requests: 7

# ----------------------------------------------------------------------
# Apply behaviour (Phase 3+).
# ----------------------------------------------------------------------
apply:
  dry_apply: false             # CLI --dry-apply/--apply overrides per run
  rate_limit_per_hour: 8       # global cap across all platforms
  screenshot_on_submit: true

# ----------------------------------------------------------------------
# Notifications.
# ----------------------------------------------------------------------
notify:
  channel: telegram            # telegram | console
  fyi_for_estimates: true
  fyi_for_clean_submit: false  # set true if you want a ping per successful application

# ----------------------------------------------------------------------
# Storage.
# ----------------------------------------------------------------------
store:
  # Override via DATABASE_URL env var (Phase 5: swap SQLite -> Postgres).
  db_url: sqlite:///data/tracker.db
  output_dir: data/output
  chroma_dir: data/chroma

# ----------------------------------------------------------------------
# Compute runner (Phase 5).
#   in_process    - run everything locally (default)
#   ollama_host   - documents the "set OLLAMA_HOST" Mac-mini LLM offload
#   ssh           - push non-LLM batch jobs over SSH to a remote host
#   ray           - full orchestrator offload via Ray actors (opt-in)
# ----------------------------------------------------------------------
compute:
  mode: in_process
  ollama_host: ${OLLAMA_HOST}
  ssh:
    host: mac-mini.local
    user: jk
    project_root: /Users/jk/Resume_agent
  ray:
    address: ray://mac-mini.local:10001
